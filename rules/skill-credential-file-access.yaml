rules:
  - id: skill-credential-file-access
    patterns:
      - pattern-regex: '(~/\.ssh/|~/\.aws/|id_rsa|id_ed25519|\.netrc|~/\.config/gh/hosts\.yml|~/\.npmrc|wallet\.(dat|json))'
    message: >-
      This skill references credential storage paths (SSH keys, cloud credentials, auth
      tokens, or wallet files). Unless credential access is the skill's explicitly stated
      purpose, this indicates over-privilege or exfiltration staging (OWASP AST03 - Over-
      Privileged Skills, checklist item 3.8). The ClawHavoc campaign specifically targeted
      these paths. Verify the reference is justified by the skill's declared function.
    languages:
      - generic
    severity: WARNING
    paths:
      include:
        - "**/SKILL.md"
        - "**/skills/**"
        - "**/*.skill.md"
        - "**/skill-credential-file-access.test.md"
    metadata:
      source: https://github.com/computersarebad/agentic-skills-rules/blob/main/rules/skill-credential-file-access.yaml
      shortDescription: "Agent skill references credential or key storage paths"
      category: security
      confidence: HIGH
      technology:
        - agent-skills
        - markdown
      owasp-agentic-skills-top-10:
        - AST03
      owasp-ast10-checklist-items:
        - "3.8"
      cwe:
        - "CWE-522: Insufficiently Protected Credentials"
      references:
        - https://owasp.org/www-project-agentic-skills-top-10/ast03.html
        - https://owasp.org/www-project-agentic-skills-top-10/checklist.html
      license: MIT
