name: False positive report
description: A rule flagged a benign skill file
title: "[FP] <rule-id>: "
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: skill-curl-pipe-shell
    validations:
      required: true
  - type: textarea
    id: snippet
    attributes:
      label: Flagged content
      description: The minimal snippet that triggered the finding (redact anything sensitive).
      render: markdown
    validations:
      required: true
  - type: textarea
    id: why-benign
    attributes:
      label: Why this is benign
      description: Why should this pattern not be flagged, or how could the rule distinguish it?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Scanner and version
      placeholder: semgrep 1.174.0 / opengrep x.y.z
